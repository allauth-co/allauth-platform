# Merge into ~/.codex/config.toml after building and completing terminal login.
# Replace the absolute executable path before use.
[mcp_servers.allauth]
command = "node"
args = ["/absolute/path/AllAuth/apps/auth/mcp/dist/index.js"]

[mcp_servers.allauth.env]
ALLAUTH_URL = "https://allauth.co"
ALLAUTH_ALLOW_SENSITIVE = "false"
